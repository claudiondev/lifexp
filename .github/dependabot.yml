# Atualizações automáticas de dependências (RS16). Semanal, com as atualizações menores e de correção agrupadas num
# único PR por pasta para não inundar a revisão; atualização maior (quebra de compatibilidade) vem em PR próprio.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'ci(deps)'
