services:
  postgres:
    image: postgres:17-alpine
    container_name: lifexp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lifexp
      POSTGRES_PASSWORD: lifexp
      POSTGRES_DB: lifexp
    ports:
      - '5432:5432'
    volumes:
      - lifexp-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lifexp -d lifexp']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lifexp-pgdata:
